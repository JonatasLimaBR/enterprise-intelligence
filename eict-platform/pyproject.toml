[project]
name = "eict"
version = "0.1.0"
description = "Enterprise Intelligence Control Tower - DataOps demo platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "databricks-sdk>=0.30",
    "requests>=2.32",
]

[project.scripts]
bootstrap = "eict.jobs.bootstrap_ops:main"
collect = "eict.jobs.collect:main"
correlate = "eict.jobs.correlate:main"
narrate = "eict.jobs.narrate:main"
dispatch = "eict.jobs.dispatch:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
    "build>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: requires a local SparkSession"]
addopts = "-m 'not spark'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"pipelines/*.py" = ["F821"]
