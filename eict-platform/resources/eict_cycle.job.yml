resources:
  jobs:
    eict_cycle:
      name: eict-cycle-${bundle.target}
      max_concurrent_runs: 1
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: "0 */5 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema_prefix
          default: ${var.schema_prefix}
        - name: tenant_id
          default: ${var.tenant_id}
        - name: landing_dir
          default: ${var.landing_dir}
        - name: secret_scope
          default: ${var.secret_scope}
        - name: github_repo
          default: ${var.github_repo}
        - name: jira_base_url
          default: ${var.jira_base_url}
        - name: jira_project
          default: ${var.jira_project}
        - name: llm_endpoint
          default: ${var.llm_endpoint}
        - name: contracts_dir
          default: ${workspace.file_path}/contracts
        - name: metrics_dir
          default: ${workspace.file_path}/metrics
        - name: workload_repo
          default: ${var.workload_repo}
        - name: baselines_dir
          default: ${workspace.file_path}/baselines
        - name: runbooks_dir
          default: ${workspace.file_path}/runbooks
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
      tasks:
        # Uma única task: cada task de job serverless paga ~4 min montando o ambiente
        # Python. O pipeline Lakeflow é disparado pelo SDK dentro deste mesmo processo.
        - task_key: cycle
          environment_key: default
          python_wheel_task:
            package_name: eict
            entry_point: cycle
            parameters:
              - "--catalog={{job.parameters.catalog}}"
              - "--schema-prefix={{job.parameters.schema_prefix}}"
              - "--tenant-id={{job.parameters.tenant_id}}"
              - "--landing-dir={{job.parameters.landing_dir}}"
              - "--secret-scope={{job.parameters.secret_scope}}"
              - "--github-repo={{job.parameters.github_repo}}"
              - "--jira-base-url={{job.parameters.jira_base_url}}"
              - "--jira-project={{job.parameters.jira_project}}"
              - "--llm-endpoint={{job.parameters.llm_endpoint}}"
              - "--contracts-dir={{job.parameters.contracts_dir}}"
              - "--metrics-dir={{job.parameters.metrics_dir}}"
              - "--workload-repo={{job.parameters.workload_repo}}"
              - "--baselines-dir={{job.parameters.baselines_dir}}"
              - "--runbooks-dir={{job.parameters.runbooks_dir}}"
              - "--pipeline-id=${resources.pipelines.medallion.id}"
